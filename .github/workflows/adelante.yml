# Cada mes: actualiza la tabla del universo sin sesgo de supervivencia (bt.universo) y corre la prueba
# hacia adelante de lo aprobado (bt.adelante): sólo datos posteriores a cada evaluación. Commitea a main
# results/adelante/, results/universo/, el reporte y la bitácora. No toca approved.json: las
# sugerencias de subir o bajar de nivel las decide Felipe por PR.
name: adelante

on:
  schedule:
    - cron: "17 11 3 * *"   # día 3 de cada mes, 08:17 hora de Chile: el mes anterior ya está publicado
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: evaluar   # la misma que evaluar: los dos escriben la bitácora
  cancel-in-progress: false

jobs:
  adelante:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Caché de datos
        uses: actions/cache/restore@v4
        with:
          path: data
          key: datos-${{ github.run_id }}
          restore-keys: datos-
      - name: "Universo: los más operados de cada mes, con retirados"
        run: python -m bt.universo --construir
      - name: Prueba hacia adelante
        run: python -m bt.adelante --bajar
      - name: Cartera de lo aprobado
        run: python -m bt.cartera
      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/adelante results/universo results/reports/adelante.md results/reports/cartera.md results/mediciones.jsonl
          if git diff --cached --quiet; then echo "sin cambios"; exit 0; fi
          git commit -m "Prueba hacia adelante y universo del mes ($(date -u +%Y-%m))"
          # main pudo avanzar mientras corría (un merge de Felipe): se rebasa antes de empujar.
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Guardar caché (aunque falle la publicación, el volumen bajado no se pierde)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: datos-${{ github.run_id }}
