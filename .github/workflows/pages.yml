# Dashboard en GitHub Pages. Requiere Settings → Pages → Source: "GitHub Actions".
name: pages

on:
  push:
    branches: [main]
    paths: ["results/**", "src/bt/sitio.py"]
  workflow_run:
    workflows: [evaluar]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0   # el auditor verifica el pre-registro con la historia
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: "Auditoría (no frena la publicación: el dashboard la muestra)"
        run: python -m bt.auditoria --json results/auditoria.json || true
      - run: python -m bt.sitio --salida _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
