# Sincroniza las etiquetas de GitHub con .operador.yml (marco de operación, OPERACION.md §3).
name: etiquetas

on:
  push:
    branches: [main]
    paths: [".operador.yml"]
  workflow_dispatch:

permissions:
  issues: write

jobs:
  etiquetas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/etiquetas.py "$GITHUB_REPOSITORY"
