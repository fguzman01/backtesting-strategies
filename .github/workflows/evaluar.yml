# La factory: evalúa cada spec pre-registrada que todavía no tiene evaluación.
# - Rechazadas / no concluyentes: el resultado se commitea directo a main.
# - Aprobadas (tocan results/approved.json, que llega a dinero real): se abre un PR que aprueba Felipe.
name: evaluar

on:
  push:
    branches: [main]
    paths: ["specs/**"]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: evaluar
  cancel-in-progress: false

jobs:
  evaluar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Caché de datos
        uses: actions/cache@v4
        with:
          path: data
          # Una llave nueva por corrida para guardar lo bajado; restaura la más reciente de cualquier
          # workflow (validacion incluida) y `bt.data` completa sólo los meses que faltan.
          key: datos-${{ github.run_id }}
          restore-keys: datos-
      - name: Evaluar specs pendientes
        id: eval
        run: python -m bt.evaluar --pendientes --bajar --salida-github "$GITHUB_OUTPUT"
      - name: Publicar resultados
        if: steps.eval.outputs.evaluadas != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          APROBADAS: ${{ steps.eval.outputs.aprobadas }}
          IDS: ${{ steps.eval.outputs.ids }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results
          if [ "$APROBADAS" != "0" ]; then
            rama="evaluacion/${GITHUB_RUN_ID}"
            git checkout -b "$rama"
            git commit -m "Evaluación con estrategia aprobada: $IDS"
            git push origin "$rama"
            {
              echo "La factory aprobó: \`$IDS\`."
              echo
              echo "Este PR agrega la estrategia a \`results/approved.json\`, que consume btc-signal-web."
              echo "Revisá los reportes en \`results/reports/\` antes de hacer merge."
              for id in $IDS; do echo; echo "---"; echo; cat "results/reports/$id.md"; done
            } > cuerpo.md
            gh pr create --base main --head "$rama" --title "Estrategia aprobada: $IDS" --body-file cuerpo.md
          else
            git commit -m "Evaluación: $IDS"
            git push origin HEAD:main
          fi
