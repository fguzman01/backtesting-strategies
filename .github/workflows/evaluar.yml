# La factory: evalúa cada spec pre-registrada que todavía no tiene evaluación.
# - Rechazadas / no concluyentes: el resultado se commitea directo a main.
# - Aprobadas (tocan results/approved.json, que llega a dinero real): se abre un PR que aprueba Felipe.
name: evaluar

on:
  push:
    branches: [main]
    paths: ["specs/**"]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: evaluar
  cancel-in-progress: false

jobs:
  evaluar:
    runs-on: ubuntu-latest
    timeout-minutes: 150   # con universo dinámico se bajan ~200 símbolos la primera vez
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # el pre-registro (commit y fecha de la spec) sale de la historia de git
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Caché de datos
        uses: actions/cache@v4
        with:
          path: data
          # Una llave nueva por corrida para guardar lo bajado; restaura la más reciente de cualquier
          # workflow (validacion incluida) y `bt.data` completa sólo los meses que faltan.
          key: datos-${{ github.run_id }}
          restore-keys: datos-
      - name: Evaluar specs pendientes
        id: eval
        run: python -m bt.evaluar --pendientes --bajar --salida-github "$GITHUB_OUTPUT"
      - name: Publicar resultados
        if: steps.eval.outputs.evaluadas != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          APROBADAS: ${{ steps.eval.outputs.aprobadas }}
          IDS: ${{ steps.eval.outputs.ids }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 1) Los resultados van SIEMPRE a main, también los de una aprobada: así la spec queda
          #    evaluada y ninguna corrida posterior vuelve a mirar su holdout (pasó con el #32 y el #36).
          git stash push -q -- results/approved.json 2>/dev/null || true
          git add results 02-DOCS/decisiones.md
          git commit -m "Evaluación: $IDS"
          git pull --rebase origin main  # main pudo avanzar mientras evaluaba
          git push origin HEAD:main
          # 2) Lo único que pide la decisión de Felipe es approved.json: va solo, por PR.
          if [ "$APROBADAS" != "0" ]; then
            rama="evaluacion/${GITHUB_RUN_ID}"
            git checkout -b "$rama"
            git stash pop -q
            git add results/approved.json
            git commit -m "approved.json: $IDS"
            git push origin "$rama"
            {
              echo "La factory aprobó (o dejó en observación): \`$IDS\`."
              echo
              echo "Este PR **sólo** agrega la estrategia a \`results/approved.json\` con su \`nivel\` (lo consume btc-signal-web)."
              echo "Los resultados ya están en main. \`observacion\` = sólo paper. Mirá la ficha en cada reporte."
              for id in $IDS; do echo; echo "---"; echo; cat "results/reports/$id.md"; done
            } > cuerpo.md
            gh pr create --base main --head "$rama" --title "Estrategia aprobada u observación: $IDS" --body-file cuerpo.md
          fi
