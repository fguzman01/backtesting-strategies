# Cierre del día al grupo de Telegram (OPERACION.md §4, cronista), 21:00 hora de Chile. Sin tokens de
# Claude. Sólo se manda si hubo movimiento o hay decisiones pendientes (decisión de Felipe, 2026-11-06).
name: cierre

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  cierre:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - env:
          GH_TOKEN: ${{ github.token }}
          OPERADOR_URL: ${{ secrets.OPERADOR_URL }}
          OPERADOR_KEY: ${{ secrets.OPERADOR_KEY }}
          PYTHONPATH: src
        run: |
          desde=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 200 --json number,title,labels,state,body,url > issues.json
          gh pr list --repo "$GITHUB_REPOSITORY" --state open --json number,title,url > prs.json
          python - "$desde" <<'PY'
          import json, subprocess, sys
          desde = sys.argv[1]
          repo = __import__("os").environ["GITHUB_REPOSITORY"]
          def gh(*a):
              return json.loads(subprocess.run(["gh", *a], capture_output=True, text=True, check=True).stdout or "[]")
          hechos = []
          for p in gh("pr", "list", "--repo", repo, "--state", "merged", "--search", f"merged:>={desde}",
                      "--json", "number,title"):
              hechos.append(f"PR #{p['number']} fusionado: {p['title']}")
          for i in gh("issue", "list", "--repo", repo, "--state", "closed", "--search", f"closed:>={desde}",
                      "--json", "number,title"):
              hechos.append(f"#{i['number']} cerrado: {i['title']}")
          for i in gh("issue", "list", "--repo", repo, "--state", "open", "--search", f"created:>={desde}",
                      "--json", "number,title"):
              hechos.append(f"#{i['number']} nuevo: {i['title']}")
          ev = subprocess.run(["git", "log", f"--since={desde}", "--name-only", "--format=", "--", "results/evaluaciones"],
                              capture_output=True, text=True).stdout.split()
          for f in sorted(set(ev)):
              hechos.append(f"evaluada: {f.rsplit('/', 1)[-1].removesuffix('.json')}")
          json.dump(hechos, open("hechos.json", "w"), ensure_ascii=False)
          PY
          # Con --recordar, después del resumen se reenvían las tarjetas (con botones) de lo pendiente.
          python -m bt.operador cierre --issues issues.json --prs prs.json --hechos hechos.json --recordar
