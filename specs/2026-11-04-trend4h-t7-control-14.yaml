id: 2026-11-04-trend4h-t7-control-14
estado: pre-registrada
fuente: "Backlog B-05 (Felipe, 2026-11-04): medir TREND_4H_T7 sin sesgo de supervivencia"
pregunta: "¿Cuánto del edge de TREND_4H con tope de 7 días es sesgo de supervivencia (14 tokens vivos vs. los más operados de cada mes)?"

hipotesis: >
  Pregunta de medición, no una estrategia nueva (backlog B-05): cuánto del edge de
  `2026-11-02-trend4h-tope-7d` (TREND_4H_T7, en paper en btc-signal-web) es sesgo de supervivencia.
  Se aprobó (hoy en observación) midiendo sólo los 14 tokens que siguen vivos. Este par de specs
  corre la MISMA regla, parámetros, costos y tope en la MISMA ventana (desde 2020-04, primer mes de
  la tabla del universo, sin historia de spot): `una con el universo de cada spec; la otra usa el universo dinámico (2026-11-04-trend4h-t7-universo-dinamico)`. La diferencia entre los dos avgR de
  desarrollo es lo que aportaba elegir sobrevivientes. Sin cupo, igual que la evaluación original,
  para cambiar una sola cosa. Criterio exigente por defecto (como toda spec nueva); el veredicto de
  cada una importa menos que la comparación. Holdout contaminado: ya se miró al aprobarla.
  Esta es el control: los 14 tokens fijos de la evaluación original, en la ventana corta.

ya_probado: >
  decisiones.md: `2026-11-02-trend4h-tope-7d` aprobada (hoy observación): desarrollo 2017-08→2025-09,
  14 tokens, n=4631, +0.245 [+0.178, +0.312]; holdout +0.036. Medir en tokens vivos sesga por
  construcción (decisiones.md, 2026-11-03). No se cambia la regla: misma configuración 20/10/20/200/2.0.

horizonte:
