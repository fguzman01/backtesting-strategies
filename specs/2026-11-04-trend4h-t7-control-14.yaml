estrategia:
  modulo: tendencia_donchian
  params: {entrada: 20, salida: 10, atr_n: 20, ema_n: 200, stop_atr: 2.0}

universo:
  mercado: futures
  simbolos: [ADAUSDT, AVAXUSDT, BNBUSDT, BTCUSDT, DOGEUSDT, DOTUSDT, ETHUSDT, LINKUSDT, LTCUSDT,
             NEARUSDT, SOLUSDT, TRXUSDT, UNIUSDT, XRPUSDT]
  intervalo: 4h
  funding: true

config:
  fee_pct_por_lado: 0.001   # comisión 0.05% + deslizamiento 0.05%, igual que la original
  deslizamiento_pct: 0.0
  timeout_velas: 42         # 7 días en 4h
  objetivo_r: null
  cerrar_al_final: true

ventana_desarrollo:
  desde: "2020-04-01"       # primer mes de results/universo/futures-usdt.json; igual en las dos

criterio_aprobacion:
