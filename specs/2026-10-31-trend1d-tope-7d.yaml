hipotesis: >
  TREND_1D (Donchian 20/10, stop 2×ATR20, filtro EMA200, 14 tokens) tiene edge real: pasó
  desarrollo, control nulo y holdout. Pero su duración media es de 22 días, fuera del alcance de
  esta factory (mediana ≤ 7 días). Si buena parte del movimiento a favor ocurre en la primera
  semana tras la ruptura, cortar a los 7 días conserva un edge positivo y distinguible del azar.

ya_probado: >
  En btc-signal-web: TREND_1D sin tope, desarrollo n=567 +0.545R, holdout n=107 +0.256R
  (reproducido por este repo, Fase 2). Sin las 10 mejores operaciones cae a +0.024, o sea depende
  de pocas tendencias largas: es justo lo que un tope de 7 días corta. Nunca se midió con tope de
  tiempo. Abrir el techo en SCALP_1H no sirvió, pero aquí la pregunta es la inversa (cerrarlo).

