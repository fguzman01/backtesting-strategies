# Pre-registro. Se escribe ANTES de correr y no se edita después de ver el número.
# Archivo: specs/<id>.yaml, con id = AAAA-MM-DD-<slug>. Validación: bt.spec (corre en los tests).
# Al pasar `estado` a `pre-registrada` y llegar a main, el workflow `evaluar` la corre sola.
id: 2026-11-01-ejemplo
estado: borrador            # borrador | pre-registrada
fuente: "de dónde salió la idea (issue, paper, repo, etc.)"
pregunta: "¿La pregunta que responde, como se buscaría en 02-DOCS/decisiones.md?"

hipotesis: >
  Qué mecanismo de mercado debería producir el edge y por qué no se lo comería la comisión.

ya_probado: >
  Qué dice 02-DOCS/decisiones.md sobre algo parecido, y por qué esto es distinto.

horizonte:                  # 02-DOCS/alcance.md: señal 5m–1d, trades de días como mucho
  tipo: diario              # scalp | swing | diario
  duracion_mediana_esperada: "3 días"   # se exige ≤ 7 días al evaluar

# Familia y variantes (desde 2026-11-02, pedido de btc-signal-web). La familia agrupa las variantes de
# una misma idea: la evaluación cuenta cuántas se probaron (n_pruebas) y, si alguna ya miró el holdout,
# lo da por contaminado. Sin `familia`, se usa el módulo.
familia: donchian
holdout_contaminado: false  # true si ese período ya se miró con algo emparentado (p. ej. en btc-signal-web)
# madre:                    # si es variante de otra: se corre al lado, mismo período, tokens y cupo
#   nombre: "TREND_4H sin tope"
#   modulo: tendencia_donchian
#   params: {entrada: 20, salida: 10}
#   config: {timeout_velas: 84}

estrategia:
  modulo: donchian_breakout   # src/bt/strategies/<modulo>.py
  params: {entrada: 20, salida: 10, atr_mult: 2.0}

universo:
  mercado: futures          # futures | spot
  simbolos: [BTCUSDT, ETHUSDT]
  intervalo: 1d             # 5m 15m 30m 1h 2h 4h 6h 8h 12h 1d
  funding: true             # cobrar funding (sólo futuros)
  historia_spot: true       # antes de que existan los futuros, usar spot (2017-2019: incluye el bajista de 2018)

config:
  fee_pct_por_lado: 0.0005  # comisión (+ deslizamiento, si se quiere modelar como costo)
  deslizamiento_pct: 0.0
  timeout_velas: 7          # obligatorio; como máximo 14 días
  objetivo_r: null
  cerrar_al_final: true     # lo abierto al final de la ventana se cierra y cuenta
  max_por_direccion: null   # cupo de cartera como el bot: p. ej. 3 (TREND_4H) o 5 (TREND_1D) abiertas por dirección
  # Gestión de la posición (opcional, como el bot real). Trailing: la estrategia devuelve la columna
  # `trailing` (distancia en precio). Ver el docstring de bt.engine.
  breakeven_r: null         # p. ej. 1.0: al avanzar 1R el stop pasa a la entrada
  tp1_r: null               # p. ej. 1.0: TP1 a 1R...
  tp1_cierre: 1.0           # ...cerrando esta fracción (1.0 = TP1 es el objetivo; 0.5 = parcial + breakeven)

ventana_desarrollo:
  desde: "2017-01-01"       # termina sola en el holdout (2025-09-09); sin historia_spot, los futuros empiezan ~2019-2020

criterio_aprobacion:        # todo en desarrollo; si pasa, se mira el holdout UNA vez
  n_minimo: 100             # menos que esto → NO_CONCLUYENTE
  ic95_excluye_cero: true   # avgR > 0 con ±2 EE fuera del cero
  concluyente: true         # muestra, modelos de llenado y tramos coherentes (bt.metrics)
  tramos_positivos_minimo: 3
  supera_nulo_p95: true     # le gana al percentil 95 de entradas al azar
  holdout:                  # se mira UNA vez; endurecido el 2026-11-02 (ver reglas-de-medicion.md)
    avgRNeto_positivo: true
    aguanta_costos: true          # con costos ×1.5 sigue > 0
    sin_mejores_no_negativo: true # sin las 10 mejores operaciones, ≥ 0
    fraccion_desarrollo_minima: 0.33  # conserva al menos 1/3 del avgR de desarrollo
