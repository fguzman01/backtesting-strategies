id: 2026-11-11-compresion-ruptura-4h
estado: pre-registrada
fuente: "Idea #12 de 02-DOCS/ideas.md (en cola, Felipe 2026-11-09, con TREND_4H como madre de control). Catálogo: Compresión de volatilidad + ruptura (blog de CryptoDataDownload, evidencia D para la regla; el agrupamiento de la volatilidad es un hecho empírico robusto)"
pregunta: "¿Entrar en la ruptura de la caja tras una compresión de volatilidad (ancho de Bollinger en su percentil ≤ 10) tiene edge neto de comisión en 4h, y le agrega algo a un Donchian común (TREND_4H)?"

hipotesis: >
  Mecanismo: la volatilidad se agrupa; tras un período de rango muy estrecho el rango siguiente tiende
  a ser mayor. Mientras el precio está comprimido, quienes venden volatilidad u operan el rango dentro
  de la caja acumulan órdenes stop justo afuera; la ruptura las dispara y la expansión siguiente es la
  que paga. La dirección no se predice: se espera a que el cierre salga de la caja. Regla, UNA sola
  configuración fijada antes de correr: en 4h, ancho de Bollinger (20 velas, 2 σ, relativo a la media)
  en o por debajo del percentil 10 de los anchos de las 180 velas anteriores (30 días) = compresión;
  la caja es el máximo/mínimo de las 20 velas que terminan en la última vela comprimida y sigue vigente
  6 velas (24 h) después; señal cuando el cierre cruza afuera de la caja (una por cruce), largo arriba,
  corto abajo, entrada en la apertura siguiente. Stop al otro lado de la caja, pero como mínimo a
  1 ATR14 del cierre (una caja muy estrecha haría pesar la comisión de más en R). Trailing 2 ATR14 desde
  la entrada (lo mueve el motor); sin objetivo. Tope 42 velas (7 días): con el trailing la mediana
  esperada queda en 1–3 días, dentro del alcance. Comisión: 0.1% por lado (comisión + deslizamiento: se
  entra en una ruptura, donde el deslizamiento importa). La caja comprimida es estrecha y el ATR también
  se achica en la compresión, así que muchas entradas pueden quedar en el piso de 1 ATR: con un ATR de 4h
  de ~0.6% la comisión pesa hasta ~0.3R (y algo más si la apertura de t+1 se acerca al stop). El edge
  bruto tiene que superar eso; es el riesgo central y lo decide avgRNeto. Universo
  dinámico top 20 (sin sesgo de supervivencia). Cupo 3 por dirección como TREND_4H. La madre de control
  es TREND_4H con tope de 7 días: si la compresión no le gana a un Donchian común en el mismo período y
  tokens, no agrega nada. Criterio exigente por defecto, con el ajuste por pruebas contando las rupturas
  medidas en btc-signal-web (ver pruebas_previas): se acepta que eso lo hace difícil de pasar a propósito.
  Riesgos: evidencia D para la regla exacta, y solapa con la familia ruptura/tendencia (una ruptura de la
  caja suele ser también una ruptura de Donchian 20).

ya_probado: >
  decisiones.md: SCALP_5M_BREAKOUT (ruptura en 5m/15m) retirada con 12 configuraciones, ninguna con
  intervalo fuera del cero, pero sin condición de compresión y en temporalidades donde la comisión pesa
  ~0.2R. SWING_1D (ruptura diaria a favor del régimen semanal) rechazada, n=138. Sesiones en oro (ruptura
  del rango asiático) rechazada: el rango es de una hora fija, no de volatilidad. TREND_4H (Donchian 20/10
  en 4h, tope 7 d) en observación: rompe el canal sin mirar si hubo compresión; acá el disparador es la
  compresión previa y el stop va a la caja, no a 2 ATR. Continuación por shock de volumen en 4h
  (2026-11-10) rechazada: otro disparador (volumen × retorno). La compresión de volatilidad como condición
  no figura en decisiones.md.

horizonte:
  tipo: swing
  duracion_mediana_esperada: "1-3 días (trailing 2 ATR, tope 7 días)"

familia: ruptura
medicion: false
pruebas_previas: 14         # btc-signal-web: SCALP_5M_BREAKOUT 12 configuraciones + SWING_1D ruptura diaria + ruptura del rango asiático en oro. No cuenta las 3 de TREND_4H de este repo (familia tendencia)
holdout_contaminado: true   # TREND_4H (3 variantes, una con universo dinámico top 20) ya miró este holdout en 4h con rupturas de 20 velas; la familia distinta no lo deduciría sola (revisor 2026-11-11)
madre:
  nombre: "TREND_4H con tope de 7 días"
  modulo: tendencia_donchian
  params: {entrada: 20, salida: 10, atr_n: 20, ema_n: 200, stop_atr: 2.0}
  config: {timeout_velas: 42}

estrategia:
  modulo: compresion_ruptura
  params: {bb_n: 20, bb_k: 2.0, ventana_pct: 180, pct_ancho: 0.10, vigencia: 6, atr_n: 14, stop_min_atr: 1.0, trailing_atr: 2.0}

universo:
