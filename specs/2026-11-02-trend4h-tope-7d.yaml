id: 2026-11-02-trend4h-tope-7d
estado: pre-registrada
fuente: "Idea #2 de 02-DOCS/ideas.md (Felipe, 2026-11-01): TREND_4H de btc-signal-web con tope de 7 días"
pregunta: "¿La tendencia en 4h (Donchian 20/10, stop 2 ATR, filtro EMA200) con tope de 7 días tiene edge neto dentro del alcance?"

hipotesis: >
  Las rupturas de canal con filtro de tendencia capturan la incorporación lenta de información y
  la persecución de los rezagados. En 4h una tendencia madura en horas o pocos días, no semanas:
  el canal de salida de 10 velas (~40 h) y el tope de 7 días (42 velas) deberían cortar las
  operaciones sin sacrificar la parte del movimiento donde está el edge (en TREND_1D el tope de 7 d
  se comía el edge porque la tendencia diaria tarda ~22 días). Hay más operaciones y más cortas.
  Costo: 0.1% por lado (comisión 0.05% + deslizamiento 0.05%); con stop de 2 ATR(4h) de ~2-3% la
  comisión ronda 0.07-0.10R por operación. Es el costo central: el edge bruto debe superarlo con
  holgura. Se fija UNA configuración (20/10/20/200/2.0, la misma regla que TREND_1D llevada a 4h
  sin reoptimizar) antes de correr; no se barren parámetros. Criterio exigente por defecto.
  Esta evaluación decide el cierre de la familia de tendencia en la factory (alcance.md, 2026-11-01).

ya_probado: >
  decisiones.md: TREND_4H pasó desarrollo (+0.231, n=3568) y su holdout fue más débil en btc-signal-web,
  pero sin tope de 7 días ni medido en este motor; por eso el holdout de esa familia ya fue visto allá
  y aquí se confirma sólo si pasa desarrollo. «Motor diario sobre velas de 4h» (2026-09-29) dio 0/16
  tramos, pero era otra regla (diaria remuestreada, sin canal ni EMA propios de 4h). Familia de
  tendencia en este repo: TREND_1D tope 7 d (rechazada, +0.087 [−0.001, +0.175]) y chandelier 14 d
  (rechazada, régimen). Esta es la primera variante en 4h. Se reusa el módulo tendencia_donchian
  (paridad con el original ya validada); sólo cambia el intervalo, la ventana y el tope.

horizonte:
  tipo: swing
  duracion_mediana_esperada: "1-3 días (salida por canal de 10 velas de 4h ≈ 40 h; tope 7 d)"

estrategia:
  modulo: tendencia_donchian
  params: {entrada: 20, salida: 10, atr_n: 20, ema_n: 200, stop_atr: 2.0}

universo:
  mercado: futures
  simbolos: [ADAUSDT, AVAXUSDT, BNBUSDT, BTCUSDT, DOGEUSDT, DOTUSDT, ETHUSDT, LINKUSDT, LTCUSDT,
             NEARUSDT, SOLUSDT, TRXUSDT, UNIUSDT, XRPUSDT]
  intervalo: 4h
  funding: true
  historia_spot: true       # decisión 2026-11-01: incluir 2017-2019 (el 2018 bajista) donde no hay futuros

config:
  fee_pct_por_lado: 0.001   # comisión 0.05% + deslizamiento 0.05%, igual que TREND_1D
  deslizamiento_pct: 0.0
  timeout_velas: 42         # 7 días en 4h
  objetivo_r: null
  cerrar_al_final: true

ventana_desarrollo:
  desde: "2017-01-01"

criterio_aprobacion:
  n_minimo: 300             # 4h opera seguido: la muestra debe ser grande (btc-signal-web tenía n=3568)
  ic95_excluye_cero: true
  concluyente: true
  tramos_positivos_minimo: 3
  supera_nulo_p95: true
  holdout:
    avgRNeto_positivo: true
