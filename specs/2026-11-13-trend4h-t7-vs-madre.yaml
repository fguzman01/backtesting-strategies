id: 2026-11-13-trend4h-t7-vs-madre
estado: pre-registrada
fuente: "Issue #68 (Felipe, sesión 2026-11-09/10, opción A): comparar TREND_4H_T7 con su madre sin tope; auditoría 2026-11-08, mejora 3"
pregunta: "¿El tope de 7 días le agrega algo a TREND_4H, o sólo le quita? (diferencia hija − madre ±2 EE, sólo en desarrollo)"

hipotesis: >
  Pregunta de medición, no una estrategia nueva. TREND_4H_T7 (`2026-11-02-trend4h-tope-7d`, hoy en
  observación) es variante de TREND_4H sin tope, y su ficha en `approved.json` tiene
  `comparacion_madre: null`. Esta spec corre la MISMA regla (20/10/20/200/2.0), los mismos 14 tokens,
  costos, cupo (ninguno) y ventana de desarrollo que la original; la hija usa timeout de 42 velas
  (7 d) y la madre el mayor tope que el alcance permite (84 velas = 14 d), porque `timeout_velas: null`
  no pasa la validación (alcance.md: trades de como mucho 14 días). La madre es entonces «sin tope
  efectivo de 7 d», no una tendencia sin tope: la salida por canal de 10 velas (~40 h) y el stop
  suelen cerrar antes. Se fija UNA comparación antes de correr; no se barren topes.
  Mide SÓLO el período de desarrollo (`solo_desarrollo: true`): el holdout de la familia tendencia
  ya se miró 3 veces y no se vuelve a mirar, ni para la hija ni para la madre. El veredicto de la
  spec (NO_CONCLUYENTE por diseño) importa menos que la diferencia; no va a `approved.json`.
  Interpretación fijada de antemano: si hija − madre + 2 EE < 0, el tope le quita edge a T7; si
  hija − madre − 2 EE > 0, el tope agrega; si el intervalo incluye 0, el tope no cambia nada medible.
  Las muestras se solapan, así que el ±2 EE es una guía conservadora, no un test formal.

ya_probado: >
  decisiones.md: `2026-11-02-trend4h-tope-7d` (T7) aprobada (hoy observación): desarrollo
  2017-08→2025-09, 14 tokens, n=4631, +0.245 [+0.178, +0.312]. Sin sesgo de supervivencia
  +0.126 [+0.062, +0.191] (2026-11-04). TREND_1D con tope de 7 d perdía edge frente a la versión larga
  (la tendencia diaria tarda ~22 días); en 4h no se midió el tope contra su madre. No se cambia la regla.

